[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "superbiz-agent"
version = "0.1.0"
description = "Python implementation of the SuperBizAgent single-agent Harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.2.0",
  "structlog>=24.1.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
rag = [
  "jieba>=0.42.1,<0.43",
  "llama-index-core>=0.13.0,<0.15.0",
  "llama-index-vector-stores-milvus>=1.1.0,<1.2.0",
  "pymilvus[milvus_lite]>=2.6.7,<3",
]
providers = [
  "litellm>=1.40.0",
  "dashscope>=1.20.0",
]
tools = [
  "pydantic-ai>=0.8.0",
]
eval = [
  "langsmith>=0.1.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/superbiz_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
